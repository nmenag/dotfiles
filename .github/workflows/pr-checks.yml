name: PR Checks

on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize
      - reopened

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  pr-title:
    name: Validate PR Title (Conventional Commits)
    runs-on: ubuntu-latest
    steps:
      - name: Check PR Title
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            docs
            style
            refactor
            perf
            test
            build
            ci
            revert
          requireScope: false
          wip: true

  pr-size:
    name: Label & Audit PR Size
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Assign PR Size Label
        id: size-label
        uses: pascalgn/size-label-action@v0.5.7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IGNORED: |
            mena/Cargo.lock
            *.lock
        with:
          sizes: >
            {
              "0": "size/XS",
              "20": "size/S",
              "100": "size/M",
              "300": "size/L",
              "800": "size/XL",
              "1500": "size/XXL"
            }

      - name: Audit PR Size Threshold
        run: |
          echo "PR Size Category: ${{ steps.size-label.outputs.sizeLabel }}"
          if [[ "${{ steps.size-label.outputs.sizeLabel }}" == *"XXL"* ]]; then
            echo "::warning title=Large Pull Request::This PR exceeds 1500 lines of changes. Consider breaking it down into smaller, focused pull requests for easier and safer review."
          fi
