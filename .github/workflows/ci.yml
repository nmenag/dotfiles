name: CI

on:
  push:
    branches:
      - main
      - master
      - 'chore/**'
      - 'feature/**'
      - 'fix/**'
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  lint-commits-and-pr:
    name: Lint Commits & PR Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Commitlint
        run: npm install --no-save @commitlint/cli @commitlint/config-conventional

      - name: Validate Pull Request Title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          echo "Auditing PR title: '$PR_TITLE'"
          echo "Draft status: $IS_DRAFT"

          # Handle draft / WIP status
          if [[ "$PR_TITLE" =~ ^(\[?[Ww][Ii][Pp]\]?:?[[:space:]]*) ]] || [[ "$IS_DRAFT" == "true" ]]; then
            echo "::notice title=Work in Progress::Pull request is marked as draft or work-in-progress."
            CLEAN_TITLE=$(echo "$PR_TITLE" | sed -E 's/^(\[?[Ww][Ii][Pp]\]?:?[[:space:]]*)//')
            if [[ -z "$CLEAN_TITLE" ]]; then
              echo "PR title is purely WIP. Skipping strict conventional commit check for active draft."
              exit 0
            fi
            echo "Validating underlying title: '$CLEAN_TITLE'"
            echo "$CLEAN_TITLE" | npx commitlint --config .commitlintrc.json
          else
            echo "$PR_TITLE" | npx commitlint --config .commitlintrc.json
          fi

      - name: Audit Pull Request Size
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          echo "Auditing pull request change size against origin/$BASE_REF..."
          git fetch origin "$BASE_REF" --depth=1 || true

          # Calculate added and deleted lines excluding lockfiles
          DIFF_STATS=$(git diff --numstat "origin/$BASE_REF"...HEAD | grep -v -E '(Cargo\.lock|\.lock|package-lock\.json)$' || true)

          ADDED=0
          DELETED=0
          while read -r add del file; do
            if [[ "$add" != "-" && "$del" != "-" && -n "$add" ]]; then
              ADDED=$((ADDED + add))
              DELETED=$((DELETED + del))
            fi
          done <<< "$DIFF_STATS"

          TOTAL_LINES=$((ADDED + DELETED))
          echo "PR Diff Statistics (excluding lockfiles): +$ADDED / -$DELETED (Total: $TOTAL_LINES lines changed)"

          if (( TOTAL_LINES < 20 )); then
            SIZE_CATEGORY="size/XS"
          elif (( TOTAL_LINES < 100 )); then
            SIZE_CATEGORY="size/S"
          elif (( TOTAL_LINES < 300 )); then
            SIZE_CATEGORY="size/M"
          elif (( TOTAL_LINES < 800 )); then
            SIZE_CATEGORY="size/L"
          elif (( TOTAL_LINES < 1500 )); then
            SIZE_CATEGORY="size/XL"
          else
            SIZE_CATEGORY="size/XXL"
            echo "::warning title=Large Pull Request::This pull request introduces $TOTAL_LINES lines of change (excluding lockfiles). Consider breaking large changes into smaller, atomic pull requests for easier review."
          fi
          echo "Assigned Size Assessment: $SIZE_CATEGORY"

      - name: Validate Commit Messages (Conventional Commits)
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            COMMIT_COUNT=$(git rev-list "origin/${{ github.base_ref }}"..HEAD --count 2>/dev/null || echo 0)
            if [[ "$COMMIT_COUNT" -gt 0 ]]; then
              echo "Validating $COMMIT_COUNT commits between origin/${{ github.base_ref }} and HEAD..."
              npx commitlint --from "origin/${{ github.base_ref }}" --to HEAD --config .commitlintrc.json --verbose
            else
              echo "No commits ahead of origin/${{ github.base_ref }}. Validating HEAD..."
              npx commitlint --last --config .commitlintrc.json --verbose
            fi
          elif [[ "${{ github.event_name }}" == "push" && -n "${{ github.event.before }}" && "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            COMMIT_COUNT=$(git rev-list "${{ github.event.before }}"..HEAD --count 2>/dev/null || echo 0)
            if [[ "$COMMIT_COUNT" -gt 0 ]]; then
              echo "Validating $COMMIT_COUNT commits between ${{ github.event.before }} and HEAD..."
              npx commitlint --from "${{ github.event.before }}" --to HEAD --config .commitlintrc.json --verbose
            else
              echo "Validating HEAD commit..."
              npx commitlint --last --config .commitlintrc.json --verbose
            fi
          else
            echo "Validating HEAD commit..."
            npx commitlint --last --config .commitlintrc.json --verbose
          fi

  verify-and-test:
    name: Workstation Verification & Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-22.04]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          manifest-path: mena/Cargo.toml

      - name: Verify Bash script syntax (bash -n)
        run: |
          echo "Checking syntax across all shell scripts..."
          for f in install.sh scripts/*.sh shell/*.sh ai/adapters/*.sh; do
            if [[ -f "$f" ]]; then
              bash -n "$f"
            fi
          done
          echo "All shell scripts passed syntax check (bash -n)."

      - name: Run repository verification suite (verify.sh)
        run: ./scripts/verify.sh

      - name: Run mena Rust unit & integration tests
        run: cargo test --manifest-path mena/Cargo.toml --all-targets --verbose

      - name: Build mena release binary
        run: cargo build --release --manifest-path mena/Cargo.toml

      - name: Smoke test mena CLI commands
        run: |
          # Verify help and version
          ./mena/target/release/mena --help
          ./mena/target/release/mena --version

          # Verify catalog listing and filtering
          ./mena/target/release/mena list
          ./mena/target/release/mena list -c cli
          ./mena/target/release/mena list -c cli --json

          # Verify environment diagnostic engine
          ./mena/target/release/mena doctor

          # Verify non-interactive simulation of workstation setup
          ./mena/target/release/mena install --dry-run --yes

          # Verify core foundation installation simulation
          ./mena/target/release/mena core --dry-run
