[package]
name = "dotctl"
version = "0.1.0"
edition = "2021"
authors = ["Nicolas Mena <nmena.garzon@gmail.com>"]
description = "DevEx CLI workstation & dotfiles management assistant for Linux"

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo"] }
dialoguer = { version = "0.11", features = ["fuzzy-select"] }
console = "0.15"
colored = "2.1"
indicatif = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
